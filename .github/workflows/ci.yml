name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # The deployed API (api/index.py on Vercel) installs only the root requirements.txt.
  # This catches a module-level import of something that isn't deployed (e.g. matplotlib).
  vercel-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt httpx
      - run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "api")
          import index
          from fastapi.testclient import TestClient
          client = TestClient(index.app)
          assert client.get("/api/health").json() == {"status": "healthy"}
          with open("frontend/public/sample-loans.csv", "rb") as f:
              r = client.post("/api/analyze-bias-csv", files={"file": f},
                              data={"target_column": "approved", "sensitive_attributes": "race,sex"})
          assert r.status_code == 200, r.text
          print("deployed API imports and analyzes the sample")
          PY
