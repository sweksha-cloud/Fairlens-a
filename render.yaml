# Render Blueprint for the FairLens API (free web service).
# In Render: New > Blueprint > pick this repo. Then set ALLOWED_ORIGINS to your frontend URL.
services:
  - type: web
    name: fairlens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://fairlens.vercel.app (comma-separate several)
